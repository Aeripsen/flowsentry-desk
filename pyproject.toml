[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowsentry-desk"
version = "0.1.0"
description = "A triage agent for the network flows FlowSentry refuses to call: read-only tools, server-checked citations, a close knob certified on training data."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sepehr Jafari" }]
dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.6",
    "scipy>=1.13",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
# Claude through the Anthropic API
agent = ["anthropic>=1.15"]
# rebuilding data/desk_bundle.npz from FlowSentry (make data); pinned to the exact commit
build = [
    "flowsentry @ https://github.com/Aeripsen/flowsentry/archive/1299cd8c3ed19f0677d170b8973e64589d070430.tar.gz",
    "pandas>=2.0",
    "joblib>=1.3",
]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["desk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
